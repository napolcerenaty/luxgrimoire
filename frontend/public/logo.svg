<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 178" role="img" aria-label="LuxGrimoire">
  <defs>
    <!-- Star glow -->
    <filter id="sg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Swirl glow -->
    <filter id="swg" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Cover gradient: deep navy -->
    <linearGradient id="cov" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1f35"/>
      <stop offset="100%" stop-color="#060e1c"/>
    </linearGradient>
    <!-- Page block gradient -->
    <linearGradient id="pgs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#152e4a"/>
      <stop offset="100%" stop-color="#0d2040"/>
    </linearGradient>
    <!-- Top edge gradient -->
    <linearGradient id="top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183858"/>
      <stop offset="100%" stop-color="#0e2440"/>
    </linearGradient>
    <!-- Star fill gradient -->
    <radialGradient id="starfill" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7ad4f0"/>
      <stop offset="55%" stop-color="#4ab8d8"/>
      <stop offset="100%" stop-color="#2a9ec4"/>
    </radialGradient>
  </defs>

  <!-- ── TOP EDGE (depth) ── -->
  <polygon points="10,58 105,34 145,49 50,73" fill="url(#top)" stroke="#1e4c6e" stroke-width="0.5"/>

  <!-- ── FRONT COVER ── -->
  <polygon points="10,58 105,34 105,154 10,175" fill="url(#cov)"/>
  <!-- Cover border -->
  <polygon points="10,58 105,34 105,154 10,175" fill="none" stroke="#1e4c6e" stroke-width="1.2"/>

  <!-- ── PAGE BLOCK (right side, fore-edge) ── -->
  <polygon points="105,34 145,49 145,167 105,154" fill="url(#pgs)"/>
  <polygon points="105,34 145,49 145,167 105,154" fill="none" stroke="#1a3e5c" stroke-width="0.8"/>

  <!-- Stacked page lines -->
  <g stroke="#1c3a56" stroke-width="0.4" opacity="0.6">
    <line x1="106" y1="53"  x2="144" y2="66"/>
    <line x1="106" y1="63"  x2="144" y2="76"/>
    <line x1="106" y1="73"  x2="144" y2="86"/>
    <line x1="106" y1="83"  x2="144" y2="96"/>
    <line x1="106" y1="93"  x2="144" y2="106"/>
    <line x1="106" y1="103" x2="144" y2="116"/>
    <line x1="106" y1="113" x2="144" y2="126"/>
    <line x1="106" y1="123" x2="144" y2="136"/>
    <line x1="106" y1="133" x2="144" y2="146"/>
    <line x1="106" y1="143" x2="144" y2="156"/>
    <line x1="106" y1="153" x2="144" y2="164"/>
  </g>

  <!-- ═══ FORE-EDGE PAINTING – abstract swirls ═══ -->

  <!-- Deep shadow swirls (base) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.32">
    <path d="M 109,55 C 124,50 140,57 143,65 C 146,74 136,80 124,78 C 114,76 108,84 115,91 C 122,98 138,95 143,88" stroke="#2a9ec4" stroke-width="3"/>
    <path d="M 108,90 C 122,84 140,90 144,99 C 148,108 138,115 124,112 C 113,110 107,119 115,127" stroke="#2a9ec4" stroke-width="3"/>
    <path d="M 109,130 C 124,124 142,130 144,139 C 147,148 136,154 122,151 C 111,148 106,159 115,166" stroke="#2a9ec4" stroke-width="3"/>
  </g>

  <!-- Mid swirls with glow -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.68" filter="url(#swg)">
    <!-- Upper spiral -->
    <path d="M 120,50 C 136,45 146,54 143,63 C 140,72 125,73 117,68 C 111,64 110,73 118,80 C 125,87 140,85 144,77" stroke="#3aaecc" stroke-width="1.5"/>
    <!-- Upper-mid loop -->
    <path d="M 110,74 C 125,68 142,73 142,83 C 142,93 126,94 116,90 C 109,86 108,97 117,103 C 125,109 140,106 143,98" stroke="#3aaecc" stroke-width="1.5"/>
    <!-- Mid spiral -->
    <path d="M 112,106 C 127,100 144,107 143,117 C 142,127 126,128 115,124 C 108,120 107,131 116,138 C 124,145 140,141 144,133" stroke="#3aaecc" stroke-width="1.5"/>
    <!-- Lower spiral -->
    <path d="M 110,138 C 125,132 143,139 143,149 C 143,159 126,160 114,156 C 106,152 105,163 115,169" stroke="#3aaecc" stroke-width="1.5"/>
  </g>

  <!-- Bright accent swirls (top layer) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <!-- Upper bright scroll -->
    <path d="M 126,52 C 139,48 146,57 143,66 C 139,75 125,74 118,80 C 114,85 119,93 130,90 C 141,87 145,77 141,87 C 137,97 123,100 113,96" stroke="#4ab8d8" stroke-width="1.1"/>
    <!-- Mid bright scroll -->
    <path d="M 113,97 C 128,91 145,98 144,108 C 142,118 127,119 117,115 C 110,111 108,122 118,129 C 127,135 142,131 144,122" stroke="#4ab8d8" stroke-width="1.1"/>
    <!-- Lower bright scroll -->
    <path d="M 115,132 C 130,126 145,133 144,142 C 142,152 127,153 116,149 C 108,145 106,156 116,162" stroke="#4ab8d8" stroke-width="1.1"/>
    <!-- Fine accent curls -->
    <path d="M 116,66 C 123,62 134,65 133,72 C 131,79 120,79 116,85" stroke="#5ac4e4" stroke-width="0.75"/>
    <path d="M 116,112 C 123,108 135,112 134,119 C 132,126 120,126 116,132" stroke="#5ac4e4" stroke-width="0.75"/>
    <path d="M 116,149 C 123,145 135,149 134,156 C 132,163 120,162 116,168" stroke="#5ac4e4" stroke-width="0.75"/>
  </g>

  <!-- ── INNER COVER FRAME ── -->
  <polygon points="17,65 98,44 98,147 17,167" fill="none" stroke="#1a3858" stroke-width="0.85" opacity="0.9"/>

  <!-- ── CORNER ORNAMENTS ── -->
  <g stroke="#2a9ec4" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.72">
    <!-- top-left -->
    <path d="M 12,61 C 13,57 17,59 16,63"/>
    <path d="M 15,57 C 19,55 20,59 17,62"/>
    <circle cx="13.5" cy="60" r="1.1" fill="#2a9ec4" opacity="0.7"/>
    <!-- top-right (spine top) -->
    <path d="M 102,37 C 104,34 108,36 106,40"/>
    <path d="M 106,34 C 109,36 108,41 104,40"/>
    <circle cx="103.5" cy="36.5" r="1.1" fill="#2a9ec4" opacity="0.7"/>
    <!-- bottom-left -->
    <path d="M 11,171 C 12,176 16,174 15,171"/>
    <path d="M 14,176 C 18,177 19,174 15,172"/>
    <circle cx="12.5" cy="173" r="1.1" fill="#2a9ec4" opacity="0.7"/>
    <!-- bottom-right (spine bottom) -->
    <path d="M 102,150 C 104,154 108,152 106,149"/>
    <path d="M 105,154 C 109,153 108,149 104,149"/>
    <circle cx="103.5" cy="152" r="1.1" fill="#2a9ec4" opacity="0.7"/>
  </g>

  <!-- ══ SIX-POINTED STAR (hexagram) on cover ══ -->
  <!-- Center: (57, 108)  Outer radius: 16 -->
  <!-- Triangle ▲ up:   apex (57,92)  base (71,116)(43,116) -->
  <!-- Triangle ▽ down: apex (57,124) base (71,100)(43,100) -->

  <!-- Glow halo -->
  <g filter="url(#sg)" opacity="0.38">
    <polygon points="57,92 71,116 43,116" fill="#4ab8d8"/>
    <polygon points="57,124 71,100 43,100" fill="#4ab8d8"/>
  </g>

  <!-- Star triangles -->
  <polygon points="57,92 71,116 43,116"  fill="url(#starfill)" opacity="0.9"/>
  <polygon points="57,124 71,100 43,100" fill="url(#starfill)" opacity="0.9"/>

  <!-- Triangle outlines (crisp edges) -->
  <polygon points="57,92 71,116 43,116"  fill="none" stroke="#7ad4f0" stroke-width="0.85" opacity="0.9"/>
  <polygon points="57,124 71,100 43,100" fill="none" stroke="#7ad4f0" stroke-width="0.85" opacity="0.9"/>

  <!-- Inner hexagon highlight -->
  <polygon points="57,99 65,104 65,113 57,118 49,113 49,104" fill="#aaeeff" opacity="0.22"/>

  <!-- Star centre bright core -->
  <circle cx="57" cy="108" r="3.2" fill="#c8f4ff" opacity="0.45"/>

  <!-- ── SPINE LINE (left-edge binding) ── -->
  <line x1="10" y1="58" x2="10" y2="175" stroke="#2a9ec4" stroke-width="1.7" stroke-linecap="round" opacity="0.65"/>

  <!-- ── BOTTOM CLOSING EDGE ── -->
  <path d="M 10,175 L 105,154 L 145,167" fill="none" stroke="#2a9ec4" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
</svg>
