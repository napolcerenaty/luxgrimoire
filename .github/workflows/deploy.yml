name: Deploy to Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/luxgrimoire-web

jobs:
  build-web:
    name: Build & Push Web Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            GHOST_API_URL=${{ secrets.GHOST_API_URL }}
            GHOST_CONTENT_API_KEY=${{ secrets.GHOST_CONTENT_API_KEY }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API
        id: deploy_api
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_API_UUID }}&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json")
          echo "Response: $RESPONSE"
          DEPLOY_UUID=$(echo $RESPONSE | jq -r '.deployments[0].deployment_uuid')
          echo "deploy_uuid=$DEPLOY_UUID" >> $GITHUB_OUTPUT

      - name: Wait for API deployment
        run: |
          DEPLOY_UUID="${{ steps.deploy_api.outputs.deploy_uuid }}"
          echo "Waiting for API deployment $DEPLOY_UUID..."
          for i in $(seq 1 60); do
            RESPONSE=$(curl -s \
              "${{ secrets.COOLIFY_URL }}/api/v1/deployments/$DEPLOY_UUID" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}")
            echo "[$i/60] Full response: $RESPONSE"
            STATUS=$(echo $RESPONSE | jq -r '.status')
            echo "[$i/60] API status: $STATUS"
            if [ "$STATUS" = "finished" ]; then
              echo "✅ API deployed successfully"
              exit 0
            elif [ "$STATUS" = "failed" ] || [ "$STATUS" = "cancelled-by-user" ]; then
              echo "❌ API deployment failed: $STATUS"
              exit 1
            fi
            sleep 10
          done
          echo "❌ API deployment timed out"
          exit 1

  deploy-web:
    name: Deploy Web
    needs: [build-web, deploy-api]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Web
        id: deploy_web
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_WEB_UUID }}&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json")
          echo "Response: $RESPONSE"
          DEPLOY_UUID=$(echo $RESPONSE | jq -r '.deployments[0].deployment_uuid')
          echo "deploy_uuid=$DEPLOY_UUID" >> $GITHUB_OUTPUT

      - name: Wait for Web deployment
        run: |
          DEPLOY_UUID="${{ steps.deploy_web.outputs.deploy_uuid }}"
          echo "Waiting for Web deployment $DEPLOY_UUID..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s \
              "${{ secrets.COOLIFY_URL }}/api/v1/deployments/$DEPLOY_UUID" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" | jq -r '.status')
            echo "[$i/60] Web status: $STATUS"
            if [ "$STATUS" = "finished" ]; then
              echo "✅ Web deployed successfully"
              exit 0
            elif [ "$STATUS" = "failed" ] || [ "$STATUS" = "cancelled" ]; then
              echo "❌ Web deployment failed: $STATUS"
              exit 1
            fi
            sleep 10
          done
          echo "❌ Web deployment timed out"
          exit 1
