spring.application.name=backend

# ── PostgreSQL ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/luxgrimoire
spring.datasource.username=postgres
# Set your PostgreSQL password here (or use env var: export POSTGRES_PASSWORD=yourpassword)
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Jackson ────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── File uploads ───────────────────────────────────────────────────────────
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── CORS ───────────────────────────────────────────────────────────────────
app.cors.origins=http://localhost:5173

# ── Mail (Brevo SMTP) ──────────────────────────────────────────────────────
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=a7efb6001@smtp-brevo.com
spring.mail.password=${BREVO_SMTP_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=noreply@luxgrimoire.com
app.mail.from-name=LuxGrimoire
app.mail.enabled=true

# Base URL used in email links
app.base-url=http://localhost:5173

# Open AI
openai.api-key=${OPENAI_API_KEY:}
